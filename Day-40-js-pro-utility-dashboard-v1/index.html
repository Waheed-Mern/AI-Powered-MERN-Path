<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Professional JS Utility Dashboard for developers"
    />
    <title>JS Pro Dashboard v1.1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header style="text-align: center; margin-bottom: 30px">
      <h1 style="color: #6366f1">🚀 Developer Utility Hub</h1>
    </header>
    <main class="main-dashboard">
      <section class="card">
        <h2>➕ The Sum Selector</h2>
        <label for="numbersInputSum">Enter numbers (comma separated):</label>
        <input
          type="text"
          id="numbersInputSum"
          placeholder="e.g. 5, 10, 2, -1"
        />
        <button id="sumBtn">Calculate Sum</button>
        <div class="result-box">
          <p>Original: <span id="originalList">---</span></p>
          <p>Sum: <b id="totalSum">0</b></p>
        </div>
      </section>
      <section class="card">
        <h2>🅰️ Vowel Counter</h2>
        <label for="stringInput">Type your text:</label>
        <textarea
          id="stringInput"
          placeholder="Type sentence here..."
        ></textarea>
        <button id="countBtn">Count Vowels</button>
        <div class="result-box">
          <p>Total: <b id="vowelCount">0</b></p>
          <p id="detailsMsg"></p>
        </div>
      </section>
      <section class="card">
        <h2>📝 Smart Notes</h2>
        <input
          type="text"
          id="noteTitle"
          placeholder="Note Title..."
          aria-label="Note Title"
        />
        <textarea
          id="noteContent"
          placeholder="Note content..."
          aria-label="Note Content"
        ></textarea>
        <div class="btn-group">
          <button id="saveBtn">Save Note</button>
          <button id="clearBtn" class="danger-btn">Clear All</button>
        </div>
        <ul id="notesList"></ul>
      </section>
      <section class="card">
        <h2>⏳ Async Mapping</h2>
        <label for="numbersInputAsync">Numbers to double:</label>
        <input type="text" id="numbersInputAsync" placeholder="1, 2, 3" />
        <button id="processBtn">Start Processing</button>
        <div class="result-box">
          <p>Result: <b id="finalResult">---</b></p>
        </div>
      </section>
      <section class="card">
        <h2>🛒 Quick Store</h2>
        <div class="img-container">
          <img
            src="https://m.media-amazon.com/images/I/71lJViYorWL._AC_UY218_.jpg"
            alt="Wireless Headphones"
            loading="lazy"
            width="200"
            height="150"
          />
        </div>
        <button id="orderBtn">Place Order</button>
        <p id="orderStatus" class="status-text">Ready to order.</p>
        <div id="loader" class="pulse-text">⏳ Processing...</div>
      </section>
      <section class="card">
        <h2>☕ Coffee Bar</h2>
        <select id="coffeeType" aria-label="Select Coffee Type">
          <option value="Cappuccino">Cappuccino</option>
          <option value="Latte">Latte</option>
          <option value="Espresso">Espresso</option>
        </select>
        <button id="brewBtn">Start Brewing</button>
        <div class="machine-status">
          <h3 id="machineStatus">Idle</h3>
          <div id="loadingPulse" class="pulse-text">💨 Brewing...</div>
          <p id="readyMsg"></p>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
